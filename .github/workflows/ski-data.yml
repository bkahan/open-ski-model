name: Ski data

# Rebuilds the static ski dataset from OpenSkiData and publishes it on the
# `data` branch (a single orphan commit, force-pushed, so history stays
# small). The app reads it through jsDelivr.

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-ski-data.mjs
      - .github/workflows/ski-data.yml

permissions:
  contents: write

concurrency:
  group: ski-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --max-old-space-size=6144 scripts/build-ski-data.mjs out
      - name: Publish to data branch
        run: |
          cd out
          cat metadata.json
          git init -q -b data
          git config user.name "ski-data bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Ski data $(date -u +%Y-%m-%d)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
